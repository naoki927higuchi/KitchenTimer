<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="カップ麺の待ち時間も、料理の経過時間も。カウントダウンとカウントアップが使えるキッチンタイマー。">
<meta name="application-version" content="1.0.0">
<title>キッチンタイマー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232c594b'/%3E%3Ccircle cx='32' cy='35' r='20' fill='%23fff9ed'/%3E%3Cpath d='M32 20v15l9 6M26 8h12' fill='none' stroke='%232c594b' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--ink:#293e35;--green:#2c594b;--cream:#faf7ef;--line:#dcded1;--muted:#637065;--orange:#bb512c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:16px;min-height:100svh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.45}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{max-width:1120px;margin:auto;padding:28px 32px;display:flex;align-items:center;gap:12px}.brand-icon{width:34px;height:34px;stroke:var(--green);fill:none;stroke-width:1.7}header strong{font-size:18px;letter-spacing:.06em}.header-note{margin-left:auto;font-size:14px;color:var(--muted)}main{max-width:760px;margin:30px auto 0;padding:0 24px 36px}.eyebrow{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.22em;margin:0 0 12px}h1{text-align:center;font-size:clamp(26px,5vw,36px);font-weight:600;letter-spacing:.08em;margin:0 0 32px}.timer{position:relative;background:#fffdf8;border:1px solid var(--line);border-radius:28px;padding:28px 40px 32px;box-shadow:0 16px 48px #293e3507}.modes{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#efeee5;border-radius:14px;padding:5px}.mode{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:13px 8px;font-weight:600;font-size:16px}.mode[aria-pressed=true]{background:var(--green);color:white;box-shadow:0 2px 6px #203c3520}.readout{text-align:center;padding:32px 0 25px}.status{display:block;font-size:15px;min-height:24px;color:var(--muted)}.digits{font-family:ui-monospace,"Cascadia Mono","Consolas",monospace;font-size:clamp(62px,13vw,104px);font-weight:500;letter-spacing:-.05em;line-height:1.35;font-variant-numeric:tabular-nums}.units{display:flex;justify-content:center;gap:72px;font-size:13px;color:var(--muted);margin-top:-4px}.progress-track{height:5px;border-radius:10px;background:#ebece2;margin:24px 0 0;overflow:hidden}.progress-fill{width:0;height:100%;background:var(--green);transition:width .15s linear}.settings-label{font-size:14px;color:var(--muted);margin:0 0 10px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.preset{padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:19px}.preset[aria-pressed=true]{background:#ecf1e8;border-color:var(--green);color:var(--green);font-weight:700}.preset small{font-size:14px;font-weight:400}.custom{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:18px}.custom input{width:76px;min-height:44px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px;color:var(--ink);font-variant-numeric:tabular-nums}.custom span{font-size:14px;color:var(--muted)}.error{color:#a03522;text-align:center;font-size:14px;min-height:20px;margin:10px 0 0}.actions{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:18px}.actions button{min-height:58px;border-radius:12px;font-weight:600;font-size:18px}.reset{border:1px solid var(--line);color:var(--ink);background:transparent}.primary{border:1px solid var(--green);background:var(--green);color:white}.primary:hover,.mode[aria-pressed=true]:hover{background:#22483c}.options{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:20px;margin-top:24px}.sound{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}.sound input{width:18px;height:18px;accent-color:var(--green)}.sound-test{font-size:14px;color:var(--muted);border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;padding:8px}.up-hint{text-align:center;color:var(--muted);line-height:1.9;padding:29px 0;margin:0;min-height:166px}.note{font-size:14px;text-align:center;line-height:1.9;color:var(--muted);margin:24px 0 0}.version{font-size:12px;text-align:center;color:#7b8175;margin-top:20px}.done .digits,.done .status{color:var(--orange)}.done .progress-fill{background:var(--orange)}[hidden]{display:none!important}@media(max-width:520px){header{padding:22px 20px}.header-note{display:none}main{margin-top:16px;padding:0 16px 24px}h1{margin-bottom:24px}.timer{padding:20px;border-radius:22px}.readout{padding-top:26px}.custom{gap:7px}.custom input{width:66px}.units{gap:50px}.options{gap:4px}.note{font-size:13px}.digits{font-size:clamp(52px,16vw,82px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M12 3h8M16 3v4M24 8l3 3"/><circle cx="16" cy="19" r="11"/><path d="M16 12v7l4 3"/></svg><strong>キッチンタイマー</strong><span class="header-note">おいしい時間を、きちんと。</span></header>
<main>
<p class="eyebrow">KITCHEN TIMER</p><h1>できあがりを、待とう。</h1>
<section class="timer" aria-label="キッチンタイマー操作">
<div class="modes" role="group" aria-label="計測モード"><button class="mode" id="down" aria-pressed="true">カウントダウン</button><button class="mode" id="up" aria-pressed="false">カウントアップ</button></div>
<div class="readout"><span class="status" id="status" role="status">カップ麺の待ち時間</span><div class="digits" id="display" role="timer" aria-label="残り時間" aria-live="off">03:00</div><div class="units" aria-hidden="true"><span id="leftUnit">分</span><span id="rightUnit">秒</span></div><div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress"></div></div></div>
<div id="settings"><p class="settings-label">待ち時間を選ぶ</p><div class="presets" role="group" aria-label="待ち時間のプリセット"><button class="preset" data-seconds="180" aria-pressed="true">3 <small>分</small></button><button class="preset" data-seconds="240" aria-pressed="false">4 <small>分</small></button><button class="preset" data-seconds="300" aria-pressed="false">5 <small>分</small></button></div><div class="custom"><label for="minutes">自由に設定</label><input id="minutes" type="number" min="0" max="99" step="1" value="3" inputmode="numeric" aria-label="分" aria-describedby="error"><span>分</span><input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="秒" aria-describedby="error"><span>秒</span></div></div>
<p class="up-hint" id="upHint" hidden>0から、経過時間を計測します。<br>下ごしらえや調理時間の確認に。</p>
<p class="error" id="error" role="alert"></p>
<div class="actions"><button class="reset" id="reset">リセット</button><button class="primary" id="start">スタート</button></div>
<div class="options"><label class="sound"><input id="sound" type="checkbox" checked>終了時に音でお知らせ</label><button class="sound-test" id="testSound">音を確認</button></div>
</section>
<p class="note">待ち時間はカップ麺のパッケージに合わせて設定してください。<br>計測中はページを開いたままにし、端末のスリープを避けてください。</p>
<p class="version">Kitchen Timer · 1.0.0</p>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
let mode='down', duration=180000, elapsed=0, startedAt=0, running=false, finished=false;
let audioContext, alarmInterval, alarmTimeout;
const presets=[...document.querySelectorAll('.preset')];
function elapsedNow(){return elapsed+(running?Math.max(0,Date.now()-startedAt):0)}
function stopAlarm(){clearInterval(alarmInterval);clearTimeout(alarmTimeout);alarmInterval=null;alarmTimeout=null}
function prepareAudio(){try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return false;audioContext??=new Audio();if(audioContext.state==='suspended')void audioContext.resume().catch(()=>{$('error').textContent='音を再生できません。端末の音量とブラウザ設定をご確認ください。'});return true}catch{return false}}
function beep(){if(!audioContext||audioContext.state!=='running')return;for(let i=0;i<3;i++){const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),time=audioContext.currentTime+i*.23;oscillator.type='sine';oscillator.frequency.value=880;gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(.18,time+.012);gain.gain.exponentialRampToValueAtTime(.001,time+.17);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(time);oscillator.stop(time+.18);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()}}}
function alarm(){stopAlarm();if(!$('sound').checked)return;beep();alarmInterval=setInterval(beep,1600);alarmTimeout=setTimeout(stopAlarm,15000)}
function validate(){const m=$('minutes').value,s=$('seconds').value;const min=Number(m),sec=Number(s);const valid=m!==''&&s!==''&&Number.isInteger(min)&&Number.isInteger(sec)&&min>=0&&min<=99&&sec>=0&&sec<=59&&(min+sec)>0;$('error').textContent=valid?'':'0分01秒〜99分59秒の範囲で設定してください。';$('minutes').setAttribute('aria-invalid',String(!valid));$('seconds').setAttribute('aria-invalid',String(!valid));return valid?(min*60+sec)*1000:null}
function updateSettings(){const value=validate();if(value!==null){duration=value;elapsed=0;finished=false;stopAlarm()}presets.forEach(b=>b.setAttribute('aria-pressed',String(value===Number(b.dataset.seconds)*1000)));render()}
function render(){let value=elapsedNow();if(running&&mode==='down'&&value>=duration){running=false;finished=true;elapsed=duration;value=duration;alarm()}const seconds=mode==='down'?Math.ceil(Math.max(0,duration-value)/1000):Math.floor(value/1000);const minutes=Math.floor(seconds/60),secs=seconds%60;const text=minutes>=100?`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}:${String(secs).padStart(2,'0')}`:`${String(minutes).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;$('display').textContent=text;$('leftUnit').textContent=minutes>=100?'時・分':'分';$('rightUnit').textContent='秒';$('status').textContent=finished?'できあがり！ おいしく召し上がれ。':running?(mode==='down'?'できあがりまで、あと':'経過時間を計測中'):elapsed>0?'一時停止中':mode==='down'?'カップ麺の待ち時間':'0からスタート';$('start').textContent=finished?'もう一度':running?'一時停止':elapsed>0?'再開':'スタート';$('progress').style.width=mode==='down'?`${Math.min(100,value/duration*100)}%`:'0%';document.querySelector('.timer').classList.toggle('done',finished);const locked=running||(!finished&&elapsed>0);presets.forEach(b=>b.disabled=locked);$('minutes').disabled=locked;$('seconds').disabled=locked;$('down').disabled=running;$('up').disabled=running;document.title=(running||finished?text+' · ':'')+'キッチンタイマー'}
function reset(){running=false;elapsed=0;finished=false;stopAlarm();$('error').textContent='';render()}
function setMode(next){if(running)return;reset();mode=next;$('settings').hidden=mode!=='down';$('upHint').hidden=mode!=='up';$('down').setAttribute('aria-pressed',String(mode==='down'));$('up').setAttribute('aria-pressed',String(mode==='up'));$('display').setAttribute('aria-label',mode==='down'?'残り時間':'経過時間');$('minutes').setAttribute('aria-invalid','false');$('seconds').setAttribute('aria-invalid','false');render()}
function startPause(){if(running){elapsed=elapsedNow();running=false;render();return}if(mode==='down'){const value=validate();if(value===null)return;duration=value}if(finished){elapsed=0;finished=false}stopAlarm();if($('sound').checked&&!prepareAudio())$('error').textContent='このブラウザでは音を再生できません。画面で終了をお知らせします。';startedAt=Date.now();running=true;render()}
$('start').addEventListener('click',startPause);$('reset').addEventListener('click',reset);$('down').addEventListener('click',()=>setMode('down'));$('up').addEventListener('click',()=>setMode('up'));presets.forEach(b=>b.addEventListener('click',()=>{$('minutes').value=Number(b.dataset.seconds)/60;$('seconds').value=0;updateSettings()}));['minutes','seconds'].forEach(id=>$(id).addEventListener('input',updateSettings));$('sound').addEventListener('change',()=>{if(!$('sound').checked)stopAlarm()});$('testSound').addEventListener('click',async()=>{if(prepareAudio()){try{await audioContext.resume();beep()}catch{$('error').textContent='音を再生できません。'}}else $('error').textContent='このブラウザでは音を再生できません。'});document.addEventListener('visibilitychange',render);setInterval(render,100);render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_kitchen_timer',description:'現在の計測モード、経過時間、残り時間、実行状態を確認する。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input){if(!input||typeof input!=='object'||Array.isArray(input)||Object.keys(input).length)throw new Error('引数は空のオブジェクトを指定してください。');return{mode,running,finished,elapsedSeconds:Math.floor(elapsedNow()/1000),remainingSeconds:mode==='down'?Math.ceil(Math.max(0,duration-elapsedNow())/1000):null}}})).catch(()=>{})}catch{}}
</script>
</body>
</html>
